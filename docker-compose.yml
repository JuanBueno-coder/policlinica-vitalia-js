

services:

  web:
    build: .
    container_name: vitalia-web
    ports:
      - "8080:80"
    environment:
      ENTORNO: docker
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: vitalia-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./sql/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - datos_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_spanish_ci

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vitalia-phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  datos_mysql:
